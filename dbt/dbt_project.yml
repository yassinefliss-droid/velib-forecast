name: velib
version: "1.0.0"
config-version: 2
profile: velib

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  velib:
    staging:
      +materialized: view     # nettoyage léger, pas de stockage
    marts:
      +materialized: table    # tables finales, prêtes à interroger
